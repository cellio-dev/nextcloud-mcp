# nextcloud-mcp — Docker at repository root.
# Dev: cp .env.example .env && docker compose up -d --build
# Local Node (no Docker): npm run dev
services:
  nextcloud-mcp:
    build: .
    image: nextcloud-mcp:latest
    container_name: nextcloud-mcp
    restart: unless-stopped
    ports:
      # Host port (MCP_HTTP_PORT or legacy PORT) → container always 3000
      - "0.0.0.0:${MCP_HTTP_PORT:-${PORT:-3000}}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      # Never use host PORT inside the container — app must listen on 3000
      PORT: "3000"
      DECK_WATCH_STATE_PATH: /data/deck-watch-state.json
    volumes:
      - nextcloud-mcp-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nextcloud-mcp-data:
